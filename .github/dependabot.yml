# Weekly update PRs, grouped per ecosystem so one PR carries a week's updates and CI
# (unit tests and the end-to-end run against Immich) checks them together.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The throwaway Immich for the end-to-end tests. Immich publishes the Postgres and Valkey
  # images it supports with each release, so those follow Immich's own compose file, not
  # Dependabot; only the server image is updated here.
  - package-ecosystem: docker-compose
    directory: /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: ghcr.io/immich-app/immich-server
