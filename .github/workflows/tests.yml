name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff-and-ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked --all-groups
      - name: Ruff
        run: uvx ruff@0.17.2 check --output-format=github .
      - name: ty
        run: uvx ty@0.0.91 check --output-format=github --python .venv .
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      # tests/test_preview_parity.py runs the browser preview code under Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: uv sync --locked --all-groups
      - run: uv run ruff check --output-format=github .
      - run: uv run ty check --output-format=github
      - run: uv run pytest -q
